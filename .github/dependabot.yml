version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  ignore:
    - dependency-name: "*"
      update-types:
        - "version-update:semver-major"

- package-ecosystem: gitsubmodule # zizmor: ignore[dependabot-cooldown] daily upstream MSFT API spec checks required
  directory: "/"
  schedule:
    interval: daily
    time: "07:00"
    timezone: "UTC"
  open-pull-requests-limit: 100
