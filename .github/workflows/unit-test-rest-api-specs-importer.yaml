---
name: Importer from Rest API Specs (Unit Tests)
on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/unit-test-rest-api-specs-importer.yaml'
      - 'config/resource-manager.hcl'
      - 'config/resources/**'
      - 'submodules/rest-api-specs'
      - 'tools/importer-rest-api-specs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: custom-linux-xl
    steps:
      - name: mount a ramdisk to working dir
        run: |
          sudo mount -t tmpfs -o size=32G tmpfs "$GITHUB_WORKSPACE"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ./.go-version
          cache-dependency-path: |
            tools/*/go.sum

      - name: run unit tests
        run: |
          cd ./tools/importer-rest-api-specs
          make test

      - name: unmount ramdisk
        if: always()
        run: |
          cd /
          sudo umount -l "$GITHUB_WORKSPACE" || true
